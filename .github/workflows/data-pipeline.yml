name: data-pipeline

# q-league / anclas.jp などの公開情報を取得し、アプリ配信用 JSON を更新する。

on:
  schedule:
    # 試合・順位などは毎時17分。選手一覧を更新する0時台は日次実行へ分ける。
    - cron: "17 1-23 * * *"
    # 選手一覧は1日1回、毎日09:17 JST（00:17 UTC）に公式サイトと照合する。
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/data-pipeline.yml"

permissions:
  contents: write

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # contents:write を持つため、利用する Action は commit SHA で固定する。
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        working-directory: scripts
        run: npm ci

      - name: Typecheck & test
        working-directory: scripts
        run: |
          npm run typecheck
          npm test

      - name: Generate frequently updated JSON
        working-directory: scripts
        run: |
          npm run generate:matches
          npm run generate:partners || echo 'partners generation failed (non-fatal)'
          npm run generate:news || echo 'news generation failed (non-fatal)'
          npm run generate:history || echo 'history generation failed (non-fatal)'

      - name: Reconcile player roster (daily)
        if: github.event_name != 'schedule' || github.event.schedule == '17 0 * * *'
        working-directory: scripts
        run: npm run generate:players || echo 'players generation failed (non-fatal)'

      - name: Commit if changed
        run: |
          if [[ -z "$(git status --porcelain -- matches.json standings.json players.json partners.json history.json)" ]]; then
            echo "差分なし。commit をスキップします。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- matches.json standings.json players.json partners.json history.json
          git commit -m "data: update public feed ($(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST'))"
          git push

      # FCM_SERVICE_ACCOUNT_JSON 未設定の場合は通知を送らず正常終了する。
      - name: Notify match results (FCM)
        working-directory: scripts
        env:
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
        run: npm run notify
